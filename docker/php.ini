memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 200M
; Importar una carpeta completa puede traer MUCHOS archivos (por defecto PHP limita a 20).
max_file_uploads = 2000
; Cada archivo lleva además su ruta (paths[]): hay que subir el tope de variables de entrada.
max_input_vars = 10000
max_execution_time = 120
expose_php = Off
date.timezone = ${TZ}

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
