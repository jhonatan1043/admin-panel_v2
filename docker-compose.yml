# Uso:
#   cp .env.docker.example .env.docker   (y edita los valores)
#   docker compose --env-file .env.docker up -d --build
services:
  app:
    build:
      context: .
      target: runtime
    image: panel-admin:latest
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage-app:/var/www/html/storage/app
      - storage-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-panel_admin}
      MYSQL_USER: ${DB_USERNAME:-panel}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env.docker}
      TZ: ${TZ:-UTC}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db-data:
  storage-app:
  storage-logs:
